<!doctype html>
<html lang="en" data-theme="light" data-contrast="normal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Build the Jacobian: an interactive matrix-calculus sensitivity control room.">
  <title>Build the Jacobian</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="js/math-config.js"></script>
  <script defer src="../../../assets/mathjax/tex-svg.js"></script>
</head>
<body>
  <a class="skip-link" href="#app">Skip to game content</a>
  <header class="app-header">
    <div class="brand" aria-label="Build the Jacobian home">
      <span class="brand-mark" aria-hidden="true">J</span>
      <span><strong>Build the Jacobian</strong><small>Matrix calculus workshop</small></span>
    </div>
    <nav class="nav" aria-label="Primary navigation">
      <button type="button" data-view="welcome">Home</button>
      <button type="button" data-view="levels">Levels</button>
      <button type="button" data-view="notebook">Notebook</button>
      <button type="button" data-view="progress">Progress</button>
      <button type="button" data-view="settings">Settings</button>
    </nav>
  </header>
  <main id="app" tabindex="-1"></main>
  <div id="live-region" class="live-region" aria-live="polite" aria-atomic="true"></div>
  <noscript>This game requires JavaScript. Run it through a local HTTP server and enable JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
