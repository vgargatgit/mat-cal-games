<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172338">
  <meta name="description" content="Diagonal Detective: trace dependencies and infer Jacobian structure.">
  <title>Diagonal Detective</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script>
    window.MathJax = {
      tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
      options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] },
      startup: { typeset: false, ready: () => { MathJax.startup.defaultReady(); window.dispatchEvent(new Event('mathjax-ready')); } }
    };
  </script>
  <script defer src="../../../assets/mathjax/tex-svg.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to game</a>
  <header class="app-header">
    <button class="brand" data-nav="welcome" aria-label="Go to welcome screen">
      <span class="brand-mark" aria-hidden="true">∂</span>
      <span><strong>Diagonal Detective</strong><small>Trace the dependencies. Expose the zeros.</small></span>
    </button>
    <nav aria-label="Primary navigation">
      <button data-nav="game">Cases</button>
      <button data-nav="tutorial">Tutorial</button>
      <button data-nav="notebook">Notebook</button>
      <button data-nav="progress">Progress</button>
    </nav>
    <div class="header-actions">
      <button id="text-size-toggle" aria-pressed="false" title="Toggle larger text">A+</button>
      <button id="motion-toggle" aria-pressed="false" title="Toggle reduced motion">Motion</button>
    </div>
  </header>
  <main id="main-content" tabindex="-1">
    <div id="app" aria-live="polite"></div>
  </main>
  <div id="live-region" class="sr-only" aria-live="assertive"></div>
  <noscript>This game requires JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
