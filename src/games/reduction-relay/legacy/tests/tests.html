<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reduction Relay Tests</title><style>body{font-family:system-ui;padding:2rem;color:#172033}table{border-collapse:collapse;width:100%}th,td{padding:.5rem;border:1px solid #ccd5e3;text-align:left}.ok{color:#176b3a}.fail{color:#a32626}code{white-space:pre-wrap}</style></head><body><main><h1>Reduction Relay verification</h1><p id="summary" aria-live="polite">Running…</p><table><thead><tr><th>Status</th><th>Group</th><th>Test</th><th>Duration</th><th>Failure details</th></tr></thead><tbody id="out"></tbody></table></main><script type="module">import{runTests}from'./reduction-tests.js';const results=runTests(),passed=results.filter(x=>x.ok).length,failed=results.length-passed;document.getElementById('summary').textContent=`${passed} passed · ${failed} failed · ${results.length} total`;const out=document.getElementById('out');for(const r of results){const tr=document.createElement('tr');for(const value of [r.ok?'✓':'✗',r.group,r.name,`${r.duration.toFixed(2)} ms`,r.error||'']){const td=document.createElement('td');td.textContent=value;tr.append(td);}tr.className=r.ok?'ok':'fail';out.append(tr);}</script></body></html>
