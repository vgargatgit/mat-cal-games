<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Broadcast Factory — an interactive matrix-calculus game about scalar broadcasting, element-wise operations, and Jacobians.">
  <title>Broadcast Factory</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/math.css">
  <link rel="stylesheet" href="css/factory.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script>
    window.MathJax = {
      tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
      svg: { fontCache: 'local' },
      options: { enableMenu: false }
    };
  </script>
  <script defer src="assets/mathjax/tex-svg.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="site-header">
    <button class="brand" type="button" data-nav="welcome" aria-label="Broadcast Factory home">
      <span class="brand-mark" aria-hidden="true">BF</span>
      <span><strong>Broadcast Factory</strong><small>Matrix calculus game 5</small></span>
    </button>
    <nav aria-label="Primary navigation">
      <button type="button" data-nav="game">Factory floor</button>
      <button type="button" data-nav="notebook">Notebook</button>
      <button type="button" data-nav="progress">Progress</button>
    </nav>
    <button class="settings-button" type="button" data-action="settings" aria-expanded="false">Settings</button>
  </header>
  <div id="settings-panel" class="settings-panel" hidden></div>
  <main id="main-content" tabindex="-1"></main>
  <div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <footer>
    <span>Numerator layout: output components are rows; differentiation-input components are columns.</span>
    <a href="tests/tests.html">Run browser tests</a>
  </footer>
</body>
</html>
